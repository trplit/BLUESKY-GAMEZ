<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUESKY GAMEZ - Unblocked Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BLUESKY GAMEZ</h1>
            <p class="subtitle">Your Gateway to Unblocked Fun</p>
        </div>
        <div class="games-grid">
            <a href="games/snake.html" class="game-card">
                <div class="game-icon">🐍</div>

                <p>Classic snake gameplay</p>
            </a>
            <a href="games/pong.html" class="game-card">
                <div class="game-icon">🎾</div>
                <h3>Pong</h3>

            <a href="games/flappy.html" class="game-card">
                <div class="game-icon">🐦</div>
                <h3>Flappy Bird</h3>

            <a href="games/breakout.html" class="game-card">
                <div class="game-icon">🧱</div>

                <p>Smash the bricks</p>

                <div class="game-icon">🧠</div>
                <h3>Memory Game</h3>
